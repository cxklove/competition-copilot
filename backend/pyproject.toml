[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-copilot"
version = "0.1.0"
description = "Competition Copilot backend domain package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "tzdata>=2026.2; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
agent = ["langgraph==1.2.15", "langchain-core==1.6.10"]
agentarts = ["agentarts-sdk==0.1.6"]
mcp = ["mcp==2.3.0"]

[tool.setuptools]
packages = [
    "competition_copilot",
    "competition_copilot.agents",
    "competition_copilot.application",
    "competition_copilot.domain",
    "competition_copilot.ingestion",
    "competition_copilot.infrastructure",
    "competition_copilot.infrastructure.repositories",
    "competition_copilot.integrations",
    "competition_copilot.integrations.agentarts",
    "competition_copilot.integrations.agentarts_transport",
    "competition_copilot.integrations.local_runtime",
    "competition_copilot.integrations.mcp",
    "competition_copilot.repositories",
    "competition_copilot.tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
